<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的课程 · 爱教学</title><link rel="stylesheet" href="./workbench.css"><link rel="stylesheet" href="./calm.css"><link rel="stylesheet" href="./home.css"><link rel="stylesheet" href="./courses.css"><link rel="stylesheet" href="./api-setup.css"></head>
<body><header><a class="brand" href="./home.html">爱教学 <span>课程工作台</span></a><nav><a class="settings-link" href="./settings.html">模型与提示词设置</a></nav></header>
<div id="notice" role="alert" hidden></div><main class="course-shell"><section class="course-intro"><h1>我的课程</h1><p>先进入课程，再安排每一节课。教学资源、备课、课堂录音和学生反馈围绕同一课次保存。</p></section>
<form id="new-course" class="panel compact-form"><h2>新建课程</h2><label>课程名称<input id="new-course-title" required maxlength="500" placeholder="例如：数据结构"></label><label>课程说明（可选）<input id="new-course-description" maxlength="8000" placeholder="授课对象、学期或课程目标"></label><button class="primary" type="submit">创建课程</button></form>
<div class="course-list-heading"><h2>课程列表</h2><label><input id="show-archived" type="checkbox" class="inline-input">显示已归档</label><button id="reload-courses">刷新列表</button></div><div id="course-list" class="course-grid" aria-live="polite"></div>
<div class="home-config"><span id="home-model" role="status">正在读取模型状态…</span><a href="./settings.html">管理模型连接</a></div></main><footer class="home-footer">本地课程资料 · 教学内容由教师最终确认</footer><script type="module" src="./home.js"></script><script type="module" src="./courses-home.js"></script><script type="module" src="./api-setup.js"></script></body></html>
