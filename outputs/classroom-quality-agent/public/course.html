<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程 · 爱教学</title><link rel="stylesheet" href="./workbench.css"><link rel="stylesheet" href="./calm.css"><link rel="stylesheet" href="./courses.css"></head><body>
<header><a class="brand" href="./home.html">爱教学 <span>课程</span></a><nav><a href="./home.html">所有课程</a><a href="./settings.html">设置</a></nav></header><div id="notice" role="alert" hidden></div>
<main class="course-shell"><section class="course-intro"><h1 id="course-name">正在读取课程…</h1><p id="course-description"></p><div class="actions"><button id="archive-course">归档课程</button><button id="reload-course">刷新</button></div><details><summary>编辑课程信息</summary><form id="edit-course"><label>课程名称<input id="course-title-input" maxlength="500" required></label><label>说明<textarea id="course-description-input" rows="3" maxlength="8000"></textarea></label><button type="submit">保存课程信息</button></form></details></section>
<section class="panel"><div class="course-list-heading"><h2>课次</h2><label><input id="show-archived-lessons" type="checkbox" class="inline-input">显示已归档</label></div><form id="new-lesson" class="compact-form"><label>课次主题<input id="new-lesson-title" required maxlength="500" placeholder="例如：第3讲 · 平衡树"></label><label>授课日期<input id="new-lesson-date" type="date" required></label><button class="primary" type="submit">添加课次</button></form><div id="lesson-list" class="lesson-list"></div><div class="actions"><button id="lessons-prev">上一页</button><span id="lessons-page"></span><button id="lessons-next">下一页</button></div></section>
<section class="panel course-library"><h2>课程资料库</h2><p class="muted">教师已有资料与生成内容可以共同用于一节课。这里的文件可被多个课次选用，原文件保留供下载。</p>
<label>上传教学资源<input id="course-files" type="file" multiple accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.html,.htm,.zip,.png,.jpg,.jpeg,.webp,.mp4,.webm,.mp3,.wav,.m4a,.ogg"></label><p class="muted">每份最多50 MiB，每门课程最多200份。TXT、MD、DOCX、PPTX在15 MiB以内可提取正文；PDF、图片、音视频等保存原文件，可补充教学说明供AI参考。网页链接不会自动抓取内容。</p><p id="resource-upload-status" role="status"></p><button id="cancel-resource-upload" hidden>停止本批上传</button>
<details><summary>添加网页或教学平台链接</summary><form id="add-course-link"><label>资源名称<input id="link-title" required maxlength="255"></label><label>网址<input id="link-url" type="url" required maxlength="2048" placeholder="https://"></label><label>教学说明<textarea id="link-description" rows="3" maxlength="8000" placeholder="说明本课使用的章节、演示步骤或关键内容"></textarea></label><button type="submit">保存链接</button></form></details>
<label>查找资源<input id="resource-search" type="search" maxlength="500" placeholder="按资源名称或说明查找"></label><div id="course-resources"></div><div class="actions"><button id="resources-prev">上一页</button><span id="resources-page"></span><button id="resources-next">下一页</button></div></section></main><script type="module" src="./course.js"></script></body></html>
