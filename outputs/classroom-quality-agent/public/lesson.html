<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课次 · 爱教学</title><link rel="stylesheet" href="./workbench.css"><link rel="stylesheet" href="./calm.css"><link rel="stylesheet" href="./courses.css"><link rel="stylesheet" href="./api-setup.css"></head><body>
<header><a class="brand" href="./home.html">爱教学 <span>课次</span></a><nav><a href="./home.html">所有课程</a><a href="./settings.html">模型与问卷设置</a></nav></header><div id="notice" role="alert" hidden></div>
<main class="course-shell"><section class="course-intro"><h1 id="lesson-name">正在读取课次…</h1><p id="lesson-description"></p><div class="actions"><button id="archive-lesson">归档课次</button><button id="reload-lesson">刷新课次</button></div><details><summary>编辑课次信息</summary><form id="edit-lesson"><label>课次主题<input id="lesson-title-input" required maxlength="500"></label><label>日期<input id="lesson-date-input" type="date" required></label><label>教学目标与说明<textarea id="lesson-description-input" rows="3" maxlength="8000"></textarea></label><button type="submit">保存课次信息</button></form></details></section>
<section class="lesson-stages"><a href="./index.html"><strong>备课</strong><span>讨论、生成与调整教学内容</span></a><a href="./sprint2.html"><strong>课堂录音</strong><span id="lesson-audio-state">上传或录制这节课的音频</span></a><a href="./sprint3.html"><strong>课后反馈</strong><span>下课发布问卷，结合实际资料复盘</span></a></section>
<section class="panel"><div class="course-list-heading"><h2>本课次使用的教学资源</h2><a id="course-library-link" class="course-action">上传资料或添加链接 →</a></div><p class="muted">可同时选择教师已有课件、讲义、网页和本课次生成的资源。最多40份，正文合计50万字符。选中的资源用于课堂复盘；需要AI备课参考时，点击“加入备课资料”。</p><div id="lesson-resources"></div><div id="lesson-generated"></div><div class="actions"><button id="save-lesson-resources" class="primary">保存本课次资源选择</button><span id="lesson-resource-status" role="status"></span></div></section></main>
<script type="module" src="./lesson.js"></script><script type="module" src="./course-context.js"></script><script type="module" src="./api-setup.js"></script></body></html>
